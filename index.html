<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. // OS v4.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scanline"></div>

  <!-- Cabecera HUD -->
  <header class="hud-header">
    <div class="hud-brand">
      <span class="dot-live"></span>
      <span>STARK EDU-CORE // <strong>J.A.R.V.I.S.</strong></span>
    </div>
    <div class="hud-controls">
      <select id="voiceSelect" class="hud-select" title="Seleccionar motor de voz"></select>
      <button id="muteBtn" class="hud-btn" title="Silenciar voz">🔊 VOZ ACTIVA</button>
    </div>
  </header>

  <!-- Contenedor Central -->
  <main class="hud-main">
    <!-- Panel Izquierdo: Telemetría decorativa -->
    <aside class="hud-panel left-panel">
      <div class="panel-title">TELEMETRÍA DE RED</div>
      <div class="stat-row"><span>MOTOR IA</span><strong>GEMINI 3.8 FLASH</strong></div>
      <div class="stat-row"><span>LATENCIA</span><strong id="pingStat">24 ms</strong></div>
      <div class="stat-row"><span>MEMORIA CORTA</span><strong id="memStat">0 / 12 Nodos</strong></div>
      <div class="bar-graph">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </aside>

    <!-- Núcleo Reactor Arc -->
    <section class="core-section">
      <div id="core" class="arc-reactor" data-state="idle">
        <div class="ring ring-outer"></div>
        <div class="ring ring-middle"></div>
        <div class="ring ring-inner"></div>
        <div class="core-center">
          <div class="visualizer" id="visualizer">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>
      <div id="statusText" class="status-badge">SISTEMA EN LÍNEA — ESPERANDO ÓRDENES</div>
    </section>

    <!-- Panel Derecho: Consola de Diálogo -->
    <aside class="hud-panel right-panel">
      <div class="panel-title">REGISTRO DE COMUNICACIÓN</div>
      <div id="chatLog" class="chat-log">
        <div class="msg jarvis">
          <span class="msg-tag">J.A.R.V.I.S.</span>
          <p>Sistemas calibrados y en línea. ¿Qué vamos a investigar hoy en clase?</p>
        </div>
      </div>
    </aside>
  </main>

  <!-- Barra de Entrada Inferior -->
  <footer class="hud-footer">
    <button id="micBtn" class="mic-btn" title="Hablar con Jarvis">
      <span class="mic-icon">🎙️</span>
    </button>
    <form id="chatForm" class="input-form">
      <input
        id="userInput"
        type="text"
        placeholder="Habla por el micrófono o escribe tu consulta aquí..."
        autocomplete="off"
      />
      <button type="submit" class="send-btn">TRANSMITIR</button>
    </form>
  </footer>

  <script src="app.js"></script>
</body>
</html>
